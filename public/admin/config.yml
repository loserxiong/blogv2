backend:
  name: github
  repo: loserxiong/blogv2
  branch: main
  commit_messages:
    create: 'content: 新建 {{collection}} - {{slug}}'
    update: 'content: 更新 {{collection}} - {{slug}}'
    delete: 'content: 删除 {{collection}} - {{slug}}'
    uploadMedia: 'content: 上传图片 - {{path}}'
    deleteMedia: 'content: 删除图片 - {{path}}'

locale: zh_Hans
site_url: https://cool-praline-3ccb6c.netlify.app
display_url: https://cool-praline-3ccb6c.netlify.app
media_folder: src/assets/images/uploads
public_folder: ../../assets/images/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    media_folder: src/assets/images/uploads
    public_folder: ../../assets/images/uploads
    summary: '{{title}} — {{pubDate}}'
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text }
      - { label: 发布时间, name: pubDate, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: 作者, name: author, widget: string, default: 'Jiasheng Xiong' }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 封面图, name: cover, widget: image, required: false }
      - { label: 分享图, name: ogImage, widget: image, required: false, hint: '留空时站点会优先使用封面图。' }
      - { label: 文章卡片样式, name: postType, widget: select, required: false, options: [coverSplit] }
      - { label: 封面位置, name: coverLayout, widget: select, required: false, options: [right, left] }
      - { label: 推荐文章, name: recommend, widget: boolean, default: false, required: false }
      - { label: 置顶, name: pinned, widget: boolean, default: false, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
      - { label: 正文, name: body, widget: markdown }

  - name: photos
    label: 照片集
    label_singular: 照片集
    folder: src/content/photos
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    media_folder: src/assets/photos/uploads
    public_folder: ../../assets/photos/uploads
    summary: '{{title}} — {{date}}'
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: 说明, name: description, widget: text, required: false }
      - { label: 图标, name: icon, widget: string, default: '📷', required: false, hint: '填一个 emoji，例如 🏃、⛰️ 或 📷。' }
      - { label: 地点, name: travel, widget: string, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
      - label: 照片
        name: photos
        widget: list
        min: 1
        fields:
          - { label: 图片, name: image, widget: image }
          - { label: 图片说明, name: alt, widget: string, required: false }
          - label: 展示比例
            name: variant
            widget: select
            default: 4x3
            options: [1x1, 4x5, 4x3, 3x4, 9x16]

  - name: projects
    label: Projects
    label_singular: 项目
    folder: src/content/projects
    create: true
    extension: mdx
    format: frontmatter
    identifier_field: name
    slug: '{{slug}}'
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: './'
    summary: '{{name}}'
    fields:
      - { label: 项目名称, name: name, widget: string }
      - { label: 项目介绍, name: description, widget: text }
      - { label: 项目网站, name: website, widget: string, hint: '项目主页或下载地址。' }
      - { label: GitHub 地址, name: githubUrl, widget: string, default: '', required: false }
      - { label: 图标类型, name: type, widget: hidden, default: image }
      - { label: 项目图标, name: icon, widget: image, required: false, allow_multiple: false, hint: '会和项目资料保存在同一个文件夹。' }
      - { label: 图标样式, name: imageClass, widget: string, required: false, hint: '通常留空；只有需要额外 CSS 样式时才填写。' }
      - { label: Star 数量, name: star, widget: number, value_type: int, min: 0, default: 0 }
      - { label: Fork 数量, name: fork, widget: number, value_type: int, min: 0, default: 0 }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
